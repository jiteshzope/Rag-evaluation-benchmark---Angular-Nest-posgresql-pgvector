services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ragbench-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: ragbench
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragbench"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
