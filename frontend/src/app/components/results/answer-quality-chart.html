@if (data().length === 0) {
  <app-chart-frame title="Answer quality by question type" [hasTable]="false">
    <app-empty-chart message="No completed questions yet." />
  </app-chart-frame>
} @else {
  <app-chart-frame
    title="Answer quality by question type"
    subtitle="Did the generator use that evidence well? Faithfulness measures grounding; correctness measures agreement with the reference answer."
    [aside]="aside()"
  >
    <div class="scroll-x">
      <div [style.min-width.px]="minWidth()">
        <app-bar-chart
          [data]="data()"
          categoryKey="type"
          [series]="series"
          [chartHeight]="260"
          [valueDomain]="scoreDomain"
          [valueTicks]="scoreTicks"
          [axisWidth]="44"
          [maxBarSize]="20"
          [tickFormat]="tickFormat"
          [tooltipFormat]="tooltipFormat"
          [labelFormat]="labelFormat"
          [tooltipFooter]="tooltipFooter"
        />
      </div>
    </div>

    <app-chart-legend [items]="legend" />

    <app-data-table
      chartTable
      [columns]="['Question type', 'n', 'Faithfulness', 'Correctness', 'Relevance', 'Judge']"
      [rows]="tableRows()"
    />
  </app-chart-frame>
}
