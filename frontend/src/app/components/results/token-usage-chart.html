@if (data().length === 0) {
  <app-chart-frame title="Token usage per question" [hasTable]="false">
    <app-empty-chart message="No completed questions yet." />
  </app-chart-frame>
} @else {
  <app-chart-frame
    title="Token usage per question"
    subtitle="Averaged across every LLM call the strategy makes — rewriting, reranking, answering and judging."
    [aside]="aside()"
  >
    <div class="scroll-x">
      <div [style.min-width.px]="minWidth()">
        <app-bar-chart
          [data]="data()"
          categoryKey="type"
          [series]="series"
          [chartHeight]="230"
          [axisWidth]="52"
          [maxBarSize]="26"
          [tickFormat]="tickFormat"
          [tooltipFormat]="tooltipFormat"
          [labelFormat]="labelFormat"
        />
      </div>
    </div>

    <app-chart-legend [items]="legend" />

    <app-data-table
      chartTable
      [columns]="['Question type', 'n', 'Avg input', 'Avg output']"
      [rows]="tableRows()"
    />
  </app-chart-frame>
}
